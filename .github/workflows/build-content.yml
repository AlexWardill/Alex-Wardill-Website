name: Build CMS content

on:
  push:
    branches: [develop, production]
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'schedule' && 'production' || github.ref_name }}
    outputs:
      target_branch: ${{ steps.target.outputs.branch }}

    steps:
      - name: Set target branch
        id: target
        run: echo "branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Check out target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and build CMS content
        run: |
          npm test
          npm run build

      - name: Commit generated content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated content changes."
          else
            git commit -m "chore(content): sort and build CMS data"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.target_branch == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out production
        uses: actions/checkout@v5
        with:
          ref: production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
          artifact_name: github-pages
          preview: false
