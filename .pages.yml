# Gallery uploads stay under _uploads (excluded from Jekyll output); the build
# creates public resized images under images/optimized/gallery.
media:
  - name: gallery_uploads
    label: Gallery uploads
    input: _uploads/gallery
    output: /images/optimized/gallery
    extensions: [jpg, jpeg, png, webp, heic, heif]
    rename: false
    categories: [image]

content:
  # A single ordered list keeps image ordering and descriptions easy to edit
  # from a phone. The build exports its entries into the existing image_data.json shape.
  - name: gallery_images
    label: Gallery images
    type: file
    path: content/gallery-images.json
    format: json
    list: true
    fields:
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: gallery_uploads
      - name: description
        label: Carousel description
        type: text
        required: true
      - name: gallery
        label: Gallery
        type: select
        required: true
        options:
          values:
            - name: portraits
              label: Portraits
            - name: gigs
              label: Gigs
            - name: siena
              label: Siena
            - name: other
              label: Other
      - name: gigYear
        label: Gigs gallery year
        type: number
        description: Only used for Gigs; enter 2025 or 2026.
      - name: alt
        label: Alt text
        type: string
        required: true
      - name: order
        label: Numeric order (optional)
        type: number
        description: Optional numeric position within the gallery; otherwise list order is used.

  # These two lists are moved between and sorted by the daily content build.
  - name: upcoming_gigs
    label: Upcoming gigs
    type: file
    path: content/gigs-upcoming.json
    format: json
    list: true
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: venue
        label: Venue
        type: string
        required: true
      - name: city
        label: City
        type: string
      - name: ticketLink
        label: Ticket link
        type: string
      - name: notes
        label: Notes
        type: text

  - name: past_gigs
    label: Past gigs
    type: file
    path: content/gigs-past.json
    format: json
    list: true
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: venue
        label: Venue
        type: string
        required: true
      - name: city
        label: City
        type: string
      - name: ticketLink
        label: Ticket link
        type: string
      - name: notes
        label: Notes

settings:
  commit:
    templates:
      create: "chore(content): add {filename}"
      update: "chore(content): update {filename}"
      delete: "chore(content): remove {filename}"
