media:
  - name: gallery_uploads
    label: Gallery uploads
    input: images/gallery-uploaded
    output: /images/gallery-uploaded
    extensions: [webp, jpg, jpeg, png]
    rename: safe
    categories: [image]

content:
  - name: gigs
    label: Gigs
    type: collection
    path: content/gigs
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
      - name: venue
        label: Venue
        type: string
      - name: date
        label: Date
        type: date
      - name: ticketUrl
        label: Ticket URL
        type: string
      - name: notes
        label: Notes
        type: text
settings:
  commit:
    templates:
      create: "chore(content): add {filename}"
      update: "chore(content): update {filename}"
      delete: "chore(content): remove {filename}"
